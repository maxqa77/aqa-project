name: AQA Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_type:
        description: "Тип тестов (api / unit / all)"
        required: true
        default: "api"
      env:
        description: "Окружение (dev / stage)"
        required: true
        default: "dev"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install deps
        run: pip install flake8

      - name: Lint
        run: flake8 . || true

  unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -m unit

  api:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest --alluredir=allure-results

      - name: Ensure results exist
        run: |
          mkdir -p allure-results
          echo "ok" > allure-results/dummy.txt

      - name: Upload allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  report:
    runs-on: ubuntu-latest
    needs: api

    steps:
      - uses: actions/checkout@v3

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Install Java
        run: sudo apt-get update && sudo apt-get install -y openjdk-11-jre

      - name: Install Allure
        run: |
          wget https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.24.0/allure-commandline-2.24.0.tgz
          tar -xzf allure-commandline-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate report
        run: |
          allure generate allure-results -o allure-report || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

  deploy:
    runs-on: ubuntu-latest
    needs: report

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run selected tests
        run: |
          echo "ENV=${{ github.event.inputs.env }}"
        
          if [ "${{ github.event.inputs.test_type }}" = "api" ]; then
            pytest -m api --alluredir=allure-results
          elif [ "${{ github.event.inputs.test_type }}" = "unit" ]; then
            pytest -m unit --alluredir=allure-results
          else
            pytest --alluredir=allure-results
          fi
